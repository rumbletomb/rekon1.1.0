name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax
        run: bash -n rekon.sh tests/smoke.sh

      - name: ShellCheck
        run: shellcheck -x rekon.sh tests/smoke.sh

      - name: Offline tests
        run: bash tests/smoke.sh

